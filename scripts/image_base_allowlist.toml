# Image base allowlist (owner decision, option (a), 2026-11-11). Used by --manifest only,
# never by --packages. A fixed, named, per-package list: the unmodified distribution base
# layer and the C/C++ runtime (GCC runtime exception). No licence category is excepted:
# a package not named here, or named with a licence other than the one the image reports,
# still fails. A package our Dockerfiles install on top of the base, or one from an upstream image
# layer, is listed only when the owner approves it by name (third reason below).
#
# Fields: name (Debian binary package, no :arch), licence (the true licence), reason (one of
# the fixed reasons in scripts/license_audit.py BASE_REASONS), and `reported` only where the image's copyright file reports a
# different first License: line (missing, or the documentation licence).

[[package]]
name = "adduser"
licence = "GPL-2+"
reason = "unmodified distribution base layer, not linked into or distributed as part of Saathi code"

