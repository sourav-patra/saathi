# Dependencies outside the MIT/Apache/permissive allowlist (PL-11). Each entry has
# licence, reason and date. Only weak, file-level copyleft used UNMODIFIED as a
# transitive dependency, or the one licence the owner has approved by name in this
# file (currently regex: Apache-2.0 AND CNRI-Python), may be listed here. No licence
# category is excepted. A banned licence (GPL, LGPL, AGPL, SSPL,
# ELv2, BUSL, RSAL, non-commercial) never qualifies, and the audit refuses it.

[allow.certifi]
licence = "MPL-2.0"
reason = "File-level copyleft. Mozilla CA bundle used unmodified via httpx/aiohttp; we never modify or vendor it. Unavoidable for TLS in Python."
date = "2026-11-10"

[allow.orjson]
licence = "MPL-2.0 AND (Apache-2.0 OR MIT)"
reason = "A few MPL-licensed vendored source files, used unmodified as a compiled wheel. Pulled in transitively by langgraph/langsmith."
date = "2026-11-10"

[allow.regex]
licence = "Apache-2.0 AND CNRI-Python"
reason = "OSI-approved permissive (CNRI-Python is the historic Python licence, no copyleft). Used unmodified as a transitive dependency of the optional pii extra. Approved by the owner on 2026-11-10."
date = "2026-11-10"
