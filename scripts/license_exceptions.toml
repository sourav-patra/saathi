# Dependencies outside the MIT/Apache/permissive allowlist, each with a reason.
# Only weak, file-level copyleft used UNMODIFIED as a transitive dependency
# may be listed here. Strong copyleft (GPL/LGPL/AGPL/SSPL) never qualifies.

[allow]
certifi = "MPL-2.0 (file-level copyleft). Mozilla CA bundle used unmodified via httpx/aiohttp; we never modify or vendor it. Unavoidable for TLS in Python."
orjson = "MPL-2.0 AND (Apache-2.0 OR MIT): a few MPL-licensed vendored source files, used unmodified as a compiled wheel. Pulled in transitively by langgraph/langsmith."
