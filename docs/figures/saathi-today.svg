<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t1">What Saathi does today (Phase 0)</title>
  <desc id="d1">Three columns: the elder on WhatsApp, the Saathi server, and the caregiver on Telegram. 1: the elder sends a voice note. 2: the server saves it before acknowledging, turns the speech into text and scans it for emergency and scam phrases. 3: the caregiver receives a short summary and the elder hears "Okay, your message has arrived.". If the scan finds an emergency, the caregiver gets an alert and the elder is told to call 112, or 108 for an ambulance. Nothing is ordered in Phase 0.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111">What Saathi does today (Phase 0): listen, check, tell the family</text>

  <!-- column heads -->
  <rect x="20" y="50" width="250" height="44" rx="8" fill="#e8f4ea" stroke="#2e7d32"/>
  <text x="145" y="77" text-anchor="middle" font-size="15" fill="#111">Elder, on WhatsApp</text>
  <rect x="355" y="50" width="250" height="44" rx="8" fill="#eef1f8" stroke="#3949ab"/>
  <text x="480" y="77" text-anchor="middle" font-size="15" fill="#111">Saathi server</text>
  <rect x="690" y="50" width="250" height="44" rx="8" fill="#fdf1e6" stroke="#ef6c00"/>
  <text x="815" y="77" text-anchor="middle" font-size="15" fill="#111">Caregiver, on Telegram</text>
  <line x1="145" y1="94" x2="145" y2="440" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="480" y1="94" x2="480" y2="440" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="815" y1="94" x2="815" y2="440" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- step 1 -->
  <line x1="150" y1="130" x2="470" y2="130" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="122" text-anchor="middle" font-size="14" fill="#111">1. Voice note: "doodh khatam ho gaya"</text>

  <!-- step 2 box -->
  <rect x="370" y="145" width="220" height="92" rx="6" fill="#ffffff" stroke="#3949ab"/>
  <text x="480" y="167" text-anchor="middle" font-size="13" fill="#111">2. Saves it before replying</text>
  <text x="480" y="187" text-anchor="middle" font-size="13" fill="#111">Turns speech into text</text>
  <text x="480" y="207" text-anchor="middle" font-size="13" fill="#111">Scans for emergency and</text>
  <text x="480" y="225" text-anchor="middle" font-size="13" fill="#111">scam phrases</text>

  <!-- step 3 normal -->
  <line x1="490" y1="262" x2="805" y2="262" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="648" y="254" text-anchor="middle" font-size="14" fill="#111">3. Summary: grocery request, voice</text>
  <line x1="470" y1="290" x2="155" y2="290" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="312" y="282" text-anchor="middle" font-size="14" fill="#111">3. "Okay, your message has arrived."</text>

  <!-- emergency branch -->
  <rect x="20" y="318" width="920" height="2" fill="#c62828"/>
  <text x="30" y="342" font-size="13" font-weight="600" fill="#c62828">If the scan finds an emergency (a scam gets an OTP warning instead)</text>
  <line x1="490" y1="372" x2="805" y2="372" stroke="#c62828" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="640" y="362" text-anchor="middle" font-size="13" fill="#111">Alert at once; a keyword hit needs no model</text>
  <line x1="470" y1="402" x2="155" y2="402" stroke="#c62828" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="312" y="394" text-anchor="middle" font-size="14" fill="#111">"Call 112 now, or 108 for an ambulance"</text>
  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#444">Illustration of the Phase 0 flow with synthetic text. Phase 0 orders nothing; ordering with a caregiver tap is Phase 1.</text>
</svg>
