<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t1">What Saathi does today (Phase 0)</title>
  <desc id="d1">Three columns: the elder on WhatsApp, the Saathi server, and the caregiver on Telegram. 1: the elder sends a voice note. 2: the server saves it and replies at once "Okay, your message has arrived.". 3: it turns the speech into text and scans the text for emergency and scam phrases. 4: the caregiver gets a card saying a voice note arrived, whether it was transcribed, with the audio attached if the elder agreed to that, and the elder hears "I have told your family.". If the scan finds an emergency, the card says possible emergency and the elder is told to call 112, or 108 for an ambulance. Nothing is ordered in Phase 0.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111">What Saathi does today (Phase 0): listen, check, tell the family</text>

  <!-- column heads -->
  <rect x="20" y="50" width="250" height="44" rx="8" fill="#e8f4ea" stroke="#2e7d32"/>
  <text x="145" y="77" text-anchor="middle" font-size="15" fill="#111">Elder, on WhatsApp</text>
  <rect x="355" y="50" width="250" height="44" rx="8" fill="#eef1f8" stroke="#3949ab"/>
  <text x="480" y="77" text-anchor="middle" font-size="15" fill="#111">Saathi server</text>
  <rect x="690" y="50" width="250" height="44" rx="8" fill="#fdf1e6" stroke="#ef6c00"/>
  <text x="815" y="77" text-anchor="middle" font-size="15" fill="#111">Caregiver, on Telegram</text>
  <line x1="145" y1="94" x2="145" y2="470" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="480" y1="94" x2="480" y2="470" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="815" y1="94" x2="815" y2="470" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- step 1 -->
  <line x1="150" y1="130" x2="470" y2="130" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="122" text-anchor="middle" font-size="14" fill="#111">1. Voice note: "doodh khatam ho gaya"</text>

  <!-- step 2: save, then acknowledge at once -->
  <rect x="370" y="142" width="220" height="30" rx="6" fill="#ffffff" stroke="#3949ab"/>
  <text x="480" y="162" text-anchor="middle" font-size="13" fill="#111">2. Saves it first</text>
  <line x1="470" y1="196" x2="155" y2="196" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="312" y="188" text-anchor="middle" font-size="14" fill="#111">2. "Okay, your message has arrived."</text>

  <!-- step 3: transcribe and scan -->
  <rect x="345" y="210" width="270" height="50" rx="6" fill="#ffffff" stroke="#3949ab"/>
  <text x="480" y="230" text-anchor="middle" font-size="13" fill="#111">3. Turns speech into text,</text>
  <text x="480" y="249" text-anchor="middle" font-size="13" fill="#111">scans for emergency and scam phrases</text>

  <!-- step 4 normal -->
  <line x1="490" y1="292" x2="805" y2="292" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="648" y="284" text-anchor="middle" font-size="14" fill="#111">4. Card: voice note, transcribed, audio if agreed</text>
  <line x1="470" y1="322" x2="155" y2="322" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="312" y="314" text-anchor="middle" font-size="14" fill="#111">4. "I have told your family."</text>

  <!-- emergency branch -->
  <rect x="20" y="348" width="920" height="2" fill="#c62828"/>
  <text x="30" y="372" font-size="13" font-weight="600" fill="#c62828">If the scan finds an emergency (a scam gets an OTP warning instead)</text>
  <line x1="490" y1="402" x2="805" y2="402" stroke="#c62828" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="648" y="392" text-anchor="middle" font-size="13" fill="#111">Card: possible emergency; a keyword hit needs no classifier</text>
  <line x1="470" y1="432" x2="155" y2="432" stroke="#c62828" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="312" y="424" text-anchor="middle" font-size="14" fill="#111">"Call 112 now, or 108 for an ambulance"</text>
  <text x="480" y="475" text-anchor="middle" font-size="12" fill="#444">Illustration of the Phase 0 flow with synthetic text. Phase 0 orders nothing; ordering with a caregiver tap is Phase 1.</text>
</svg>
