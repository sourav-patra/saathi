<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 660" width="1310" height="660" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t1">Saathi target architecture and trust zones</title>
  <desc id="d1">Planned end state of Phase 4. A WhatsApp message from the elder (A1) reaches the inbox and webhook (C01) in the public edge zone Z1, which inserts a row into Postgres (X1) before answering. C01 also runs the keyword radar (C04) on the text or caption before the commit, and a hit adds the alert event to the same transaction (E26). The worker (C02) in the core zone Z2 leases the oldest row of each elder, scans ASR text with the radar and redacts text (C05). A radar flag opens an alert event in escalation (C14), which notifies the caregiver on Telegram (A2) and the approver phones (A3). Job rows go to the model worker zone Z3, where perception (C03), router (C06) and planners (C08) call hosted models only through the gateway (C16) and the egress reverse proxy (X2), which has one route per provider and does not intercept TLS. Planners pass slots to the adapters (C09) in the exception zone Z4, which reach commerce services through X2 and the home device (D1) in zone Z5 over a private mesh. Adapters return typed facts to the quote builder (C10), then the policy engine (C11), then the approval service and bot (C12), which shows a card to the caregiver. The commit executor (C13) writes audit rows (C17) and is the only caller that places an order or taps the final button through the adapters.</desc>
  <style>
    .t { font-size: 12px; font-weight: bold; fill: #111827; }
    .s { font-size: 11px; fill: #111827; }
    .z { font-size: 12px; font-weight: bold; fill: #111827; }
    .b { stroke: #111827; stroke-width: 1.5; }
    .e { fill: none; stroke: #111827; stroke-width: 1.6; }
    .n { font-size: 10px; font-weight: bold; fill: #111827; text-anchor: middle; }
    .nb { fill: #ffffff; stroke: #111827; stroke-width: 1; }
    .ext { fill: #fff7ed; stroke: #9a3412; stroke-width: 1.8; stroke-dasharray: 6 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1310" height="660" fill="#ffffff"/>
  <text x="10" y="26" font-size="16" font-weight="bold" fill="#111827">Saathi target architecture and trust zones (planned, end of Phase 4)</text>

  <!-- zones -->
  <g id="Z1"><rect x="185" y="46" width="150" height="94" rx="8" fill="#f7fee7" stroke="#111827" stroke-width="2" stroke-dasharray="7 4"/><text x="195" y="62" class="z">Z1 Edge, public</text></g>
  <g id="Z2"><rect x="350" y="46" width="465" height="480" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="3"/><text x="360" y="64" class="z">Z2 Core: code decides, no model output commits</text></g>
  <g id="Z3"><rect x="835" y="46" width="270" height="262" rx="8" fill="#f0f9ff" stroke="#111827" stroke-width="2" stroke-dasharray="2 4"/><text x="845" y="62" class="z">Z3 Model worker: no keys, no internet</text></g>
  <g id="Z4"><rect x="835" y="330" width="270" height="196" rx="8" fill="#fffbeb" stroke="#111827" stroke-width="4" stroke-dasharray="12 5"/><text x="845" y="348" class="z">Z4 Adapters: exception E-1</text></g>
  <g id="Z5"><rect x="1115" y="536" width="190" height="110" rx="8" fill="#f5f3ff" stroke="#111827" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round"/><text x="1125" y="553" class="z">Z5 Home device</text></g>

  <!-- outside parties (Z6) -->
  <g id="A1"><rect x="10" y="69" width="160" height="60" rx="5" class="ext"/><text x="20" y="87" class="t">A1 Elder (Z6)</text><text x="20" y="103" class="s">WhatsApp, helper number</text><text x="20" y="117" class="s">voice, photo, text</text></g>
  <g id="A3"><rect x="10" y="236" width="160" height="64" rx="5" class="ext"/><text x="20" y="254" class="t">A3 Approver phones (Z6)</text><text x="20" y="270" class="s">WhatsApp template T-01,</text><text x="20" y="284" class="s">automated voice call</text></g>
  <g id="A2"><rect x="10" y="320" width="160" height="112" rx="5" class="ext"/><text x="20" y="338" class="t">A2 Caregiver, backup (Z6)</text><text x="20" y="354" class="s">Telegram: alerts, cards,</text><text x="20" y="368" class="s">Approve, Edit, Reject,</text><text x="20" y="382" class="s">show raw, /pause</text></g>
  <g id="A4"><rect x="1125" y="60" width="170" height="60" rx="5" class="ext"/><text x="1135" y="78" class="t">A4 Model hosts (Z6)</text><text x="1135" y="94" class="s">hosted G2 to G4,</text><text x="1135" y="108" class="s">receipts, spend cap</text></g>
  <g id="A5"><rect x="1125" y="450" width="170" height="60" rx="5" class="ext"/><text x="1135" y="468" class="t">A5 Commerce (Z6)</text><text x="1135" y="484" class="s">MCP servers, apps,</text><text x="1135" y="498" class="s">deep links</text></g>

  <!-- Z1 -->
  <g id="C01"><rect x="195" y="69" width="130" height="60" rx="5" fill="#ecfccb" class="b"/><text x="203" y="86" class="t">C01 inbox, webhook</text><text x="203" y="102" class="s">signature, keywords,</text><text x="203" y="116" class="s">insert, commit, 200</text></g>

  <!-- X1 -->
  <g id="X1"><rect x="358" y="84" width="448" height="32" rx="4" fill="#e5e7eb" class="b"/><text x="582" y="104" class="s" text-anchor="middle">X1 Postgres: inbox, requests, tokens, commit_intent, alerts, audit_log</text></g>

  <!-- core grid -->
  <g id="C02"><rect x="358" y="146" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="366" y="163" class="t">C02 worker</text><text x="366" y="179" class="s">lease, classify,</text><text x="366" y="193" class="s">timers, effects</text></g>
  <g id="C04"><rect x="514" y="146" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="522" y="163" class="t">C04 radar</text><text x="522" y="179" class="s">keyword layer first,</text><text x="522" y="193" class="s">classifier adds flags</text></g>
  <g id="C05"><rect x="670" y="146" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="678" y="163" class="t">C05 redaction</text><text x="678" y="179" class="s">IDs, phones, OTPs,</text><text x="678" y="193" class="s">text only</text></g>
  <g id="C14"><rect x="358" y="246" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="366" y="263" class="t">C14 escalation</text><text x="366" y="279" class="s">stages a, b, c;</text><text x="366" y="293" class="s">needs no model</text></g>
  <g id="C07"><rect x="514" y="246" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="522" y="263" class="t">C07 request states</text><text x="522" y="279" class="s">one transition table,</text><text x="522" y="293" class="s">compare-and-set</text></g>
  <g id="C15"><rect x="670" y="246" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="678" y="263" class="t">C15 voice replies</text><text x="678" y="279" class="s">stored clips + hashes,</text><text x="678" y="293" class="s">local TTS, text fallback</text></g>
  <g id="C12"><rect x="358" y="346" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="366" y="363" class="t">C12 approval, bot</text><text x="366" y="379" class="s">card, tap, token,</text><text x="366" y="393" class="s">second code</text></g>
  <g id="C11"><rect x="514" y="346" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="522" y="363" class="t">C11 policy engine</text><text x="522" y="379" class="s">authorize_commit,</text><text x="522" y="393" class="s">only path to commit</text></g>
  <g id="C10"><rect x="670" y="346" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="678" y="363" class="t">C10 quote builder</text><text x="678" y="379" class="s">typed facts to Quote,</text><text x="678" y="393" class="s">hash binds approval</text></g>
  <g id="C13"><rect x="358" y="446" width="136" height="62" rx="5" fill="#e2e8f0" class="b" stroke-width="3"/><text x="366" y="463" class="t">C13 commit executor</text><text x="366" y="479" class="s">3 steps; checks the</text><text x="366" y="493" class="s">dump or cart in code</text></g>
  <g id="C17"><rect x="514" y="446" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="522" y="463" class="t">C17 audit store</text><text x="522" y="479" class="s">insert-only role,</text><text x="522" y="493" class="s">keyed hashes</text></g>
  <g id="C18"><rect x="670" y="446" width="136" height="62" rx="5" fill="#e2e8f0" class="b"/><text x="678" y="463" class="t">C18 trace export</text><text x="678" y="479" class="s">ids, counts, hashes;</text><text x="678" y="493" class="s">no text</text></g>

  <!-- Z3 -->
  <g id="C06"><rect x="845" y="72" width="120" height="58" rx="5" fill="#e0f2fe" class="b"/><text x="853" y="89" class="t">C06 router (G1)</text><text x="853" y="105" class="s">typed intent, slots</text><text x="853" y="119" class="s">from redacted text</text></g>
  <g id="C03"><rect x="975" y="72" width="120" height="58" rx="5" fill="#e0f2fe" class="b"/><text x="983" y="89" class="t">C03 perception</text><text x="983" y="105" class="s">ASR, vision; results</text><text x="983" y="119" class="s">typed, marked data</text></g>
  <g id="C16"><rect x="845" y="150" width="250" height="52" rx="5" fill="#e0f2fe" class="b"/><text x="853" y="168" class="t">C16 gateway and ledger</text><text x="853" y="184" class="s">sensitivity default PERSONAL, grades,</text><text x="853" y="197" class="s">receipts per media class, spend cap</text></g>
  <g id="C08"><rect x="845" y="226" width="200" height="64" rx="5" fill="#e0f2fe" class="b"/><text x="853" y="243" class="t">C08 intent planners</text><text x="853" y="259" class="s">typed slots, tool allowlist,</text><text x="853" y="273" class="s">no raw external text</text></g>

  <!-- Z4 -->
  <g id="C09"><rect x="845" y="360" width="250" height="100" rx="5" fill="#fef3c7" class="b" stroke-width="2.5"/><text x="853" y="378" class="t">C09 adapters</text><text x="853" y="394" class="s">MCP, deep link, phone agent</text><text x="853" y="408" class="s">navigation by macros; no credentials</text><text x="853" y="422" class="s">reads untrusted text, holds order data,</text><text x="853" y="436" class="s">can tap: the E-1 exception</text></g>
  <text x="845" y="486" class="s">Commit call or tap: C13 only (E17),</text>
  <text x="845" y="500" class="s">after code verifies the final screen.</text>

  <!-- right column -->
  <g id="X2"><rect x="1125" y="140" width="170" height="290" rx="5" fill="#ede9fe" class="b" stroke-width="2.5"/><text x="1135" y="162" class="t">X2 egress (Caddy)</text><text x="1135" y="182" class="s">reverse proxy, one</text><text x="1135" y="196" class="s">route per provider;</text><text x="1135" y="210" class="s">route set = allowlist;</text><text x="1135" y="224" class="s">no TLS interception;</text><text x="1135" y="238" class="s">keys from env file</text><text x="1135" y="268" class="s">Z3 and Z4 reach the</text><text x="1135" y="282" class="s">internet only here</text></g>
  <g id="D1"><rect x="1125" y="562" width="170" height="70" rx="5" fill="#ede9fe" class="b"/><text x="1133" y="580" class="t">D1 bridge board, phone</text><text x="1133" y="596" class="s">private mesh, VPS node</text><text x="1133" y="610" class="s">only; dedicated phone,</text><text x="1133" y="624" class="s">no banking app</text></g>

