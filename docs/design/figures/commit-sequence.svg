<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 750" width="1130" height="750" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t2">Saathi approval and three-step commit sequence</title>
  <desc id="d2">Eleven numbered messages between the caregiver on Telegram (A2), the approval service (C12), Postgres (X1), the commit executor (C13), the adapter and phone (C09) and the commerce service (A5). The caregiver gets a card and taps Approve. C12 changes the request state by compare-and-set and mints a token in one transaction. C13 navigates, re-reads the quote, then runs step 1 in one transaction that locks the household, verifies and spends the token and inserts a commit intent. Step 2 reads the final dump, verifies it in code and taps or places the order. Step 3 records the result in a second transaction. Two crash points are marked: A after step 1 with no external call, and B after the call and before step 3, where the order may exist.</desc>
  <style>
    .h { font-size: 12px; font-weight: bold; fill: #111827; }
    .s { font-size: 11px; fill: #111827; }
    .l { font-size: 11px; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .lb { font-size: 11px; font-weight: bold; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .life { stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .m { fill: none; stroke: #111827; stroke-width: 1.6; }
    .box { fill: #f1f5f9; stroke: #111827; stroke-width: 1.5; }
    .ext { fill: #fff7ed; stroke: #9a3412; stroke-width: 1.8; stroke-dasharray: 6 3; }
    .step { fill: #eef2ff; stroke: #111827; stroke-width: 1.2; stroke-dasharray: 8 3; }
    .crash { fill: #ffffff; stroke: #111827; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1130" height="750" fill="#ffffff"/>
  <text x="10" y="24" font-size="16" font-weight="bold" fill="#111827">Approval and three-step commit (planned; RQ-21, RQ-22, RQ-80, RQ-83, RQ-87)</text>

  <!-- step brackets drawn first -->
  <rect x="440" y="318" width="470" height="76" rx="6" class="step"/>
  <text x="482" y="333" class="s">STEP 1: one transaction</text>
  <rect x="670" y="414" width="260" height="50" rx="6" class="step"/>
  <text x="700" y="428" class="s">STEP 2: no database write</text>
  <rect x="440" y="508" width="470" height="44" rx="6" class="step"/>
  <text x="482" y="522" class="s">STEP 3: a second transaction</text>

  <!-- lifelines -->
  <path d="M85 80 V600" class="life"/><path d="M270 80 V600" class="life"/><path d="M470 80 V600" class="life"/><path d="M680 80 V600" class="life"/><path d="M880 80 V600" class="life"/><path d="M1040 80 V600" class="life"/>
  <g id="L-A2"><rect x="10" y="40" width="150" height="40" rx="5" class="ext"/><text x="20" y="57" class="h">A2 Caregiver (Z6)</text><text x="20" y="72" class="s">Telegram</text></g>
  <g id="L-C12"><rect x="195" y="40" width="150" height="40" rx="5" class="box"/><text x="205" y="57" class="h">C12 approval (Z2)</text><text x="205" y="72" class="s">service and bot</text></g>
  <g id="L-X1"><rect x="395" y="40" width="150" height="40" rx="5" class="box"/><text x="405" y="57" class="h">X1 Postgres (Z2)</text><text x="405" y="72" class="s">rows and audit</text></g>
  <g id="L-C13"><rect x="605" y="40" width="150" height="40" rx="5" class="box"/><text x="615" y="57" class="h">C13 executor (Z2)</text><text x="615" y="72" class="s">commit, 3 steps</text></g>
  <g id="L-C09"><rect x="805" y="40" width="150" height="40" rx="5" class="box" stroke-width="3"/><text x="815" y="57" class="h">C09 adapter (Z4)</text><text x="815" y="72" class="s">MCP or phone</text></g>
  <g id="L-A5"><rect x="975" y="40" width="130" height="40" rx="5" class="ext"/><text x="985" y="57" class="h">A5 service (Z6)</text><text x="985" y="72" class="s">order or app</text></g>

  <!-- messages -->
  <path d="M265 110 H90" class="m" marker-end="url(#a)"/><text x="178" y="104" class="l" text-anchor="middle">1 card: summary, slots, quote hash</text>
  <path d="M90 146 H265" class="m" marker-end="url(#a)"/><text x="178" y="140" class="l" text-anchor="middle">2 Approve tap (callback)</text>
  <path d="M275 182 H465" class="m" marker-end="url(#a)"/><text x="370" y="176" class="l" text-anchor="middle">3 compare-and-set, mint token, audit</text>
  <path d="M275 226 H675" class="m" marker-end="url(#a)"/><text x="475" y="220" class="l" text-anchor="middle">4 approved request and token (E15)</text>
  <path d="M685 262 H875" class="m" marker-end="url(#a)"/><text x="780" y="256" class="l" text-anchor="middle">5 navigate, re-read quote</text>
  <path d="M875 298 H685" class="m" marker-end="url(#a)"/><text x="780" y="292" class="l" text-anchor="middle">6 live quote or cart object</text>
  <path d="M675 380 H475" class="m" marker-end="url(#a)"/><text x="575" y="352" class="lb" text-anchor="middle">7 lock household, verify token,</text><text x="575" y="366" class="lb" text-anchor="middle">spend it, insert intent</text>
  <path d="M685 452 H875" class="m" marker-end="url(#a)"/><text x="780" y="446" class="lb" text-anchor="middle">8 final dump, code verifies, tap</text>
  <path d="M885 486 H1035" class="m" marker-end="url(#a)"/><text x="960" y="480" class="l" text-anchor="middle">9 place order or Book</text>
  <path d="M675 540 H475" class="m" marker-end="url(#a)"/><text x="575" y="534" class="lb" text-anchor="middle">10 record result</text>
  <path d="M675 580 H90" class="m" marker-end="url(#a)"/><text x="380" y="574" class="l" text-anchor="middle">11 outcome to the caregiver and the elder</text>

  <!-- crash markers -->
  <g id="crash-A"><path d="M668 396 l12 -12 l12 12 l-12 12 z" class="crash"/><text x="680" y="400" class="h" text-anchor="middle">A</text></g>
  <g id="crash-B"><path d="M668 498 l12 -12 l12 12 l-12 12 z" class="crash"/><text x="680" y="502" class="h" text-anchor="middle">B</text></g>

  <!-- notes -->
  <rect x="10" y="610" width="1110" height="130" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="20" y="630" class="h">Crash points and rules</text>
  <text x="20" y="650" class="s">A: a crash after step 1 means no external call has happened. The reaper sets commit_unknown after a longer timeout and the caregiver is alerted.</text>
  <text x="20" y="668" class="s">B: a crash after the call and before step 3 means an order may exist. find_order sets reconciled_placed or _not_placed, or the owner does by hand; nothing retries by itself.</text>
  <text x="20" y="686" class="s">Messages 5 and 6 change no state. A failed check in step 8 ends aborted_no_call: no call, no tap, the token stays spent, a new quote and a new tap are needed.</text>
  <text x="20" y="704" class="s">Over a cap, a code typed before the approval token expires (cart 300 s, ride 60 s) adds a confirm2 token before message 4. A second tap gets "already decided" (message 3 compare fails).</text>
  <text x="20" y="722" class="s">Dashed rounded boxes group the three steps; a diamond marks a crash point; the orange dashed boxes are outside Saathi's control; shape and label carry the meaning.</text>
</svg>
