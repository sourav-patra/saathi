[project]
name = "saathi"
version = "0.1.0"
description = "Agentic helper that takes tech chores off elders' (and their children's) plates, with a human approving every payment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",          # MIT
  "uvicorn>=0.30",           # BSD-3
  "pydantic>=2.8",           # MIT
  "pydantic-settings>=2.4",  # MIT
  "httpx>=0.27",             # BSD-3
  "aiogram>=3.13",           # MIT
  "asyncpg>=0.29",           # Apache-2.0  (NOT psycopg: LGPL)
  "langgraph>=0.2",          # MIT  (library only; never langgraph-api: ELv2)
  "langfuse>=3.0",           # MIT  (SDK)
  "cryptography>=43",        # Apache-2.0 OR BSD-3-Clause (envelope keys, AES-GCM, X25519)
  "tzdata>=2024.1",          # Apache-2.0 (IANA zone data, so zoneinfo never depends on the OS)
]

[project.optional-dependencies]
pii = [
  "presidio-analyzer>=2.2",  # MIT
  "presidio-anonymizer>=2.2" # MIT
]

[dependency-groups]
dev = [
  "pytest>=8",               # MIT
  "pytest-asyncio>=0.24",    # Apache-2.0
  "ruff>=0.6",               # MIT
]

[project.scripts]
saathi-api = "saathi.app:main_edge"
saathi-bot = "saathi.channels.telegram:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saathi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# design_check.py is a locked design-set file, merged byte for byte (WU-01); its line lengths are not ours to change.
"scripts/design_check.py" = ["E501"]
# The tables mirror TRD rows one per line; wrapping them would hide the row structure.
"src/saathi/states/tables.py" = ["E501"]
