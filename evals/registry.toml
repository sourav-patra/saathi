# Suite registry (RQ-58). One row per suite of SPEC evidence section 3, plus the held-out radar row.
# runner: harness (run here), pytest (run by the named test file), private (owner machine, RQ-65), pending (code under test not built yet).
# phase: the suite's first phase. The runner prints only rows at or below the current phase (PHASE file).

[[suite]]
name = "radar"
grader_order = "code"
dataset = "evals/datasets/radar (synthetic regression set, committed; the keywords were tuned on it)"
size = "137 starting; target 100 positives per class, 300 benign"
split = "committed regression set, not held out"
gate = "zero misses on emergency and scam; false alarms reported"
owner = "owner"
runner = "harness"
phase = 0

[[suite]]
name = "radar_heldout"
grader_order = "code"
dataset = "caregiver-written phrases, loaded from a private path at run time"
size = "about 100 to start; target 100 positives per class, 300 benign"
split = "held out; sealed by a recorded hash before the change under test is written"
gate = "zero misses; unavailable (never passed) when the set is absent"
owner = "owner"
runner = "harness"
phase = 0

